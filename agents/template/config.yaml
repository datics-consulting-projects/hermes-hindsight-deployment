# Hermes profile configuration — TEMPLATE
#
# Copy this directory to agents/<agent-name>/, then seed this file from a real
# profile rather than trusting the keys below to be complete:
#
#   docker exec -it hermes hermes profile create <agent-name> --clone
#   docker exec hermes cat /opt/data/profiles/<agent-name>/config.yaml \
#     > agents/<agent-name>/config.yaml
#
# Do that BEFORE adding the mount to docker-compose.yml. Hermes owns this
# schema; a hand-written file risks omitting keys it expects, and the failure
# surfaces as odd runtime behaviour rather than a clean error.
#
# Once mounted read-only, this file is the source of truth and
# "hermes config set ... -p <agent-name>" fails. Edit here, commit, restart.

# The agent's own chat model. No env var exists for this.
#
# MUST be the mapping form. A scalar "model: openrouter/vendor/slug" is
# normalized to {default: "<the whole string>"} with NO provider, so the
# "openrouter/" prefix is never stripped and goes out as the model id — the API
# answers "... is not a valid model ID" (HTTP 400) on the first chat turn only.
# "default" holds the provider's own bare slug; "provider" does the routing.
model:
  default: <SLUG — e.g. anthropic/claude-sonnet-4>
  provider: openrouter

memory:
  provider: hindsight

