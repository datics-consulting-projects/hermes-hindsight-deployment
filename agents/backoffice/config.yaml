# Hermes profile configuration — backoffice
#
# Mounted read-only at /opt/data/profiles/backoffice/config.yaml. Consequences:
#
#   - This file is the source of truth. Edit it here, commit, restart.
#   - "hermes -p backoffice config set ..." WILL FAIL (read-only filesystem).
#     That is the intended tradeoff: config as code, not config as volume state.
#   - Hermes runs config migrations on startup and rewrites config.yaml when the
#     schema changes. Against a read-only mount that migration cannot write.
#     If a version bump ever fails to start, this is the first thing to check —
#     copy the container's migrated file back into the repo and commit it.
#
# SEED THIS FILE RATHER THAN HAND-WRITING IT. Hermes owns the schema and the
# full set of defaults is not documented. Before mounting, create the profile
# and copy out what Hermes itself generated:
#
#   docker exec hermes cat /opt/data/profiles/backoffice/config.yaml \
#     > agents/backoffice/config.yaml
#
# then edit down to what you actually want to pin. The keys below are the two
# the deployment currently relies on (README § "Choosing the Hermes chat model"
# and setup step 6).

# The agent's own chat model. No env var exists for this — see README.
#
# MUST be the mapping form. A scalar "model: openrouter/vendor/slug" is
# normalized to {default: "<the whole string>"} with NO provider, so the
# "openrouter/" prefix is never stripped and goes out as the model id —
# OpenRouter answers "... is not a valid model ID" (HTTP 400). The provider
# is a separate key; "default" holds the bare OpenRouter slug.
model:
  default: "nvidia/nemotron-3.5-lightning:free"
  provider: openrouter

memory:
  provider: hindsight
  # !! ALSO UNVERIFIED. The generated `memory:` block has memory_enabled,
  # user_profile_enabled, memory_char_limit, user_char_limit, provider,
  # nudge_interval and flush_min_turns — no write_approval. The gate itself
  # does exist (Slack's /memory command exposes `approval on|off`), so the key
  # may simply be absent until set. Confirm it round-trips before treating it
  # as the G8 mitigation:
  #   hermes config set memory.write_approval true -p default
  #   hermes config get memory.write_approval -p default
  #
  # ON before any new input path opens — plan §11.2. Slack IS that new input
  # path: it is the first surface where people who are not you put text in
  # front of the agent, and Hermes syncs turns to Hindsight after each
  # response, so without this gate anything said in the channel becomes
  # durable memory unreviewed. This is the interim standing in for the §10.1
  # reader/writer split, which is not built. See gap-register G8.
  write_approval: true

# --- Slack ------------------------------------------------------------------
# DISCOVERY IS DONE (2026-08-20). Findings, so nobody re-derives them:
#
#   * There is NO `channels:` key in this build. Plan §6.3's
#     `channels.slack.respondTo: mention` does not exist — do not add it.
#     What does exist is a TOP-LEVEL `slack:` block, applied below.
#   * Slack is configured by `hermes gateway setup`, not by `hermes slack`
#     (manifest generation only).
#   * CREDENTIALS ARE ENVIRONMENT VARIABLES, not config keys — SLACK_BOT_TOKEN,
#     SLACK_APP_TOKEN, SLACK_SIGNING_SECRET, confirmed present in /opt/hermes.
#     Nothing about Slack auth belongs in this file; it lives in the per-agent
#     .env.
#   * Authorization is `hermes pairing list|approve|revoke`, a runtime store in
#     the volume — audit it, it is not reviewable in git:
#       docker exec hermes hermes pairing list
#     It has a declarable companion, `SLACK_ALLOWED_USERS`, which is the ONE
#     Slack gate with no config key: it is read straight from the environment
#     by gateway/authz_mixin.py, so it lives in the per-agent .env and not
#     here. Never GATEWAY_ALLOW_ALL_USERS=true or SLACK_ALLOW_ALL_USERS=true.
#
# CORRECTED 2026-08-20, resolving S9. An earlier version of this comment said
# the BEHAVIOUR gates had no config keys either, and that mention-only had
# exactly one enforcement point. Both are false. Every gate except the user
# allowlist is bridged out of the `slack:` block below into its SLACK_* env
# var, so this file is a genuine second layer under the manifest.
#
# Runbook: docs/plans/slack-integration.md
# Open defects: docs/issues/slack-integration.md (S10 is the live one).

# The Slack behaviour gates. HOW THIS FILE REACHES THEM, since none of it is
# obvious from the key names — gateway/config.py::load_gateway_config() reads
# <profile home>/config.yaml, i.e. this file, and hands its top-level `slack:`
# mapping to the Slack plugin's `_apply_yaml_config` hook
# (plugins/platforms/slack/adapter.py), which translates each key into the
# SLACK_* environment variable the adapter actually reads at message time.
#
# PRECEDENCE IS THE TRAP: THE ENVIRONMENT WINS. Every assignment in that hook
# is guarded by `not os.getenv(...)`, so the same gate set in the per-agent
# .env silently overrides the value here and this file quietly stops being the
# truth. Keep each gate in exactly ONE home. These live here; only the three
# tokens and SLACK_ALLOWED_USERS live in .env.
#
# THE DEFAULTS ARE MOSTLY UNSAFE, which is the reason to pin them rather than
# leave them alone. Read out of the installed build on 2026-08-20:
#
#   require_mention             default TRUE   — the only one that fails closed
#   strict_mention              default false
#   thread_require_mention      default false
#   ignore_other_user_mentions  default false
#   disable_dms                 default false
#   allow_bots                  default "none" — safe
#   allowed_channels            default EMPTY  — EMPTY MEANS EVERY CHANNEL
#   free_response_channels      default empty  — lists channels answered
#                                                WITHOUT a mention; never set
#
# WHAT THESE DO AND DO NOT DO TODAY. The manifest subscribes to `app_mention`
# and nothing else, so Slack never delivers a non-mention message and these
# gates have nothing to act on. They are not decoration for that reason: they
# are the layer that keeps a future `message.channels` line in the manifest
# from silently opening the channel. Set them while it costs nothing.
slack:
  # Answer only when @-mentioned. Already the default; pinned because a gate
  # that matters should not depend on a default staying put across upgrades.
  require_mention: true

  # Every message in a thread needs its own @-mention. Turns off the adapter's
  # auto-triggers — mentioned-thread memory, bot-message follow-up and
  # session-presence — each of which answers a message that never mentioned
  # the bot. A thread is where mention-only leaks first.
  strict_mention: true

  # The same rule stated on the other axis, for thread replies specifically.
  # Both are set: they are separate code paths in the adapter.
  thread_require_mention: true

  # A message whose first token @-mentions someone else is addressed to that
  # person, not to the bot. Off by default for backward compatibility.
  ignore_other_user_mentions: true

  # Enforces plan §6.2 at runtime instead of only by withholding the `im:*`
  # scopes. Two layers, and this one does not depend on nobody re-pasting a
  # wider manifest into Slack's UI.
  disable_dms: true

  # "none" | "mentions" | "all". Nothing here needs bot-to-bot traffic, and an
  # admitted bot bypasses the human allowlist entirely (authz_mixin.py).
  allow_bots: "none"

  # Channels answered WITHOUT a mention. The direct negation of everything
  # above. Pinned explicitly empty so the key is visible and unset-by-accident
  # is distinguishable from set-to-nothing.
  free_response_channels: []

  # THE CHANNEL SCOPE, and the one line here left to fill in. When non-empty,
  # messages from channels not in the list are ignored even on an @-mention;
  # EMPTY MEANS NO RESTRICTION, so as written the only thing scoping the bot
  # is the /invite. Put the pilot channel's ID here at invite time — open the
  # channel in Slack, right-click the name, Copy link, take the C… id — and a
  # stray invite to a second channel becomes inert instead of live.
  # allowed_channels:
  #   - "C0123456789"

# What the agent may DO on Slack, as opposed to on the CLI. This is the key
# `agent.disabled_toolsets` was mistaken for, and unlike that one it is
# per-platform: produced by `hermes tools disable --platform slack …` and read
# back with `hermes tools --summary -p backoffice`.
#
# VERIFIED 2026-08-20, with Slack actually configured: the Slack row reads
# 5/28 and lists exactly the five below. The map is read AND applied — this is
# what closes S2. Before the app existed the summary printed no Slack row at
# all; a platform is only enumerated once it is credentialed, so the missing
# row had been evidence of nothing.
#
# The full map is pinned, not just the `slack:` entry, so a partial override
# can never leave another platform's list undefined. Cost of pinning: a Hermes
# upgrade that adds a platform will not appear here, and this file is read-only
# so the migration cannot add it — the same tradeoff the header describes.
#
# Seeded on the writable `default` profile and copied here, exactly as the
# header prescribes.
#
# OMITTING A TOOLSET FROM A LIST IS NOT ALWAYS ENOUGH TO REMOVE IT. `kanban`
# was in no list here and showed up on Slack regardless; `bfl` was in `cli:`
# only and showed up on Slack too. What removed both was
# `agent.disabled_toolsets` below — not their absence from this map. Toolsets
# outside the build's own registry (the same ones `tools disable` rejects by
# name) appear not to be governed by this map at all.
#
# So after every Hermes upgrade, run `tools --summary -p backoffice` and look
# for rows that are not listed here. A new toolset arriving enabled on Slack
# is the expected failure mode, not an unlikely one.
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  slack:
    - clarify
    - memory
    - session_search
    - skills
    - todo
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat

# Removing the execution toolsets rather than sandboxing them — plan §11.2. A
# Q&A agent has no legitimate shell, disk or browsing use, and everything it
# needs arrives through the memory provider. This is what enforces the limits
# SOUL.md's "Boundaries" section describes; the persona states them, this
# applies them.
# THIS KEY WORKS. Verified 2026-08-20 by comparing profiles, when `browser`
# was the only entry: `tools --summary -p backoffice` showed Browser
# Automation absent where the bare (default) profile showed it present. An
# earlier note here claimed the opposite; that reading came from the default
# profile's summary, which of course does not apply this file. Tool config is
# per profile — always pass -p backoffice.
#
# IT IS ALSO THE ONLY LEVER for a toolset `platform_toolsets` does not govern.
# `bfl` and `kanban` were added here on 2026-08-20 after both appeared on Slack
# despite being absent from `platform_toolsets.slack`. The counts moved
# CLI 17 -> 15 and Slack 7 -> 5. `kanban` is the clean case: it was in no list
# anywhere, so only this key can have removed it. `bfl` left `cli:` in the same
# commit, so which of the two levers fired for it was never isolated — keep
# both. Convention since: a toolset removed profile-wide is out of every
# `platform_toolsets` list AND named here. To restore one, delete it here
# deliberately; do not re-add it to a list and expect that to switch it back on.
#
# THE NAMES MUST MATCH THE BUILD'S OWN LIST: `file`, `terminal`, `web`,
# `browser`. The original block here said `files`, which silently matched
# nothing — so of the four toolsets it was meant to remove, File Operations
# was never actually removed. A wrong name fails silently; there is no error.
#
# But the names this key accepts are a SUPERSET of the ones the CLI validates:
# `hermes tools disable … kanban` answers "Unknown toolset 'kanban'", while
# `kanban` here works. That command rejecting a name is not evidence the name
# will not work here — put it in, deploy, and read the count.
#
# SCOPE: this key is profile-wide, so it takes the toolset away from the
# dashboard/CLI too. To remove something on Slack ONLY, use platform_toolsets
# above instead.
agent:
  disabled_toolsets:
    - browser
    - bfl
    - kanban
#    - web
#    - terminal
#    - files

